[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elan-career"
version = "0.1.0"
description = "Native macOS job-search workspace with semantic ranking and grounded CV and motivation-letter generation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lachtar Nour"}]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "click>=8.1",
    "openai>=1.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "rapidfuzz>=3.6",
    "unidecode>=1.3",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "tenacity>=8.2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "pyinstaller>=6.11", "pillow>=10.0"]
pdf = ["weasyprint>=61.0"]
local-embeddings = ["sentence-transformers>=2.7"]
wttj = ["playwright>=1.44"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "tiktoken>=0.7",
]

[project.scripts]
elan = "smartapply.cli:cli"
elan-desktop = "smartapply.desktop.app:main"

[project.urls]
Repository = "https://github.com/lachtarnour/elan-career"
Documentation = "https://github.com/lachtarnour/elan-career/blob/main/docs/setup.md"
Issues = "https://github.com/lachtarnour/elan-career/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartapply*"]

[tool.setuptools.package-data]
smartapply = [
  "cv/templates/*.j2",
  "cv/*.json",
  "desktop/resources/*.svg",
  "desktop/resources/icons/*.svg",
  "desktop/qml/*.qml",
  "desktop/qml/components/*.qml",
  "desktop/qml/components/qmldir",
  "desktop/qml/pages/*.qml",
  "llm/prompts/templates/*/*.j2",
  "profile/mock_profile/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: integration tests that may use network or local files",
    "llm: tests that require LLM provider (skipped without OPENAI_API_KEY)",
    "real_pdf: opt out of the html_to_pdf stub fixture (runs a real renderer)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
